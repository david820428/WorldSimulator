<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>World Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="map" aria-label="World map"></canvas>

  <header class="panel top">
    <h1>World Simulator</h1>
    <p id="stats">Wraps east–west</p>
    <form id="seed-form">
      <label for="seed">Seed</label>
      <input id="seed" type="text" autocomplete="off" spellcheck="false">
      <button type="submit">Generate</button>
      <button type="button" id="dice">Random</button>
      <div class="sizes" role="radiogroup" aria-label="World size">
        <span>World size</span>
        <label><input type="radio" name="size" value="small"> Small</label>
        <label><input type="radio" name="size" value="medium" checked> Medium</label>
        <label><input type="radio" name="size" value="large"> Large</label>
      </div>
    </form>
    <div class="modes" role="group" aria-label="Map view">
      <button data-mode="art" aria-pressed="true">Illustrated</button>
      <button data-mode="land" aria-pressed="false">Land and sea</button>
      <button data-mode="plates" aria-pressed="false">Plates</button>
      <button data-mode="temp" aria-pressed="false">Temperature</button>
      <button data-mode="rain" aria-pressed="false">Rainfall</button>
      <button data-mode="biome" aria-pressed="false">Biomes</button>
    </div>
    <label class="edges"><input type="checkbox" id="soft-edges" checked> Irregular edges and soft blending</label>
    <div id="legend" hidden><span></span><div class="ramp"></div><span></span></div>
    <div id="report"></div>
  </header>

  <div class="panel zoom" role="group" aria-label="Zoom">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="reset" aria-label="Reset view">Reset</button>
  </div>

  <aside class="panel decision-card" id="g-decision" hidden aria-live="polite"></aside>

  <aside class="panel log" id="g-log" aria-label="Event log">
    <h2>Events</h2>
    <ol id="g-log-list"></ol>
  </aside>

  <div class="panel game-bar" role="group" aria-label="Game speed">
    <div class="speed">
      <button id="g-pause" aria-label="Pause" title="Pause (Space)">&#10074;&#10074;</button>
      <button id="g-play" aria-label="Play" title="Play at normal speed (Space)">&#9654;</button>
      <button data-speed="2" title="Twice as fast">&times;2</button>
      <button data-speed="4" title="Four times as fast">&times;4</button>
      <button data-speed="8" title="Eight times as fast">&times;8</button>
    </div>
    <div class="round">
      <strong id="g-round">Round 0</strong>
      <small id="g-status">Press Play to begin</small>
      <div class="meter"><i id="g-meter"></i></div>
    </div>
    <label class="mode">When events happen
      <select id="g-mode" aria-label="When events happen">
        <option value="1">Pause on decisions</option>
        <option value="2">Pause on every event</option>
        <option value="3">Never pause (random choices)</option>
      </select>
    </label>
  </div>

  <footer class="panel bottom">
    <span id="tile-info">Hover over a tile</span>
    <span class="hint">Drag or arrow keys to scroll. Wheel, pinch or +/− to zoom.</span>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
